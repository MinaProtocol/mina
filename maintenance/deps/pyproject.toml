# Tool configuration for the dependency gate. Scoped to this directory on
# purpose: the rest of the repository's Python is not held to these rules yet,
# and ruff/ty resolve the nearest config per file.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "F",    # pyflakes
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # import sorting
  "UP",   # pyupgrade: keep us on modern syntax
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RET",  # return hygiene
  "PTH",  # prefer pathlib over os.path -- the bug class this tool already hit
  "N",    # pep8 naming
  "ARG",  # unused arguments
  "TID",  # tidy imports
]

[tool.ty.environment]
python-version = "3.12"
