[build]
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]

[source.crates-io]
replace-with = "vendored-sources"

# ocaml-gen is taken from git until a release carrying `ocaml = "1.3.0"` is cut
# (see Cargo.toml); its source has to be replaced too or the vendor directory
# is bypassed for it.
[source."git+https://github.com/o1-labs/ocaml-gen?rev=e1d1a7baba0ae445524f7d2598468177e5692b11"]
git = "https://github.com/o1-labs/ocaml-gen"
rev = "e1d1a7baba0ae445524f7d2598468177e5692b11"
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "kimchi-stubs-vendors"
