[package]
name = "wires_15_stubs"
version = "0.1.0"
authors = ["opensource@o1labs.org"]
description = "OCaml stubs for the plonk proof systems"
repository = "https://github.com/MinaProtocol/mina"
license = "MIT/Apache-2.0"
edition = "2021"

[dependencies]
ocaml = { version = "1.3.0", features = ["no-caml-startup"] }
# ocaml-gen 1.0.0 on crates.io still depends on `ocaml ^0.22.4`, which cannot
# coexist with `ocaml` 1.x. o1-labs/ocaml-gen's own master already declares
# `ocaml = "1.3.0"` but has never been released; pin the git rev until a
# release is cut. Must stay in lockstep with proof-systems/Cargo.toml.
ocaml-gen = { git = "https://github.com/o1-labs/ocaml-gen", rev = "e1d1a7baba0ae445524f7d2598468177e5692b11" }

# proof-systems
kimchi = { path = "../../proof-systems/kimchi", features = ["ocaml_types"] }
kimchi-stubs = { path = "../../proof-systems/kimchi-stubs" }

[[bin]]
name = "wires_15_stubs"
